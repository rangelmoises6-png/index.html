<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>
  <style>
    body {
      background-color: #030a16;
      color: #00d9ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 15px;
      box-sizing: border-box;
    }
    .arc-reactor {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 3px dashed #00d9ff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px #00d9ff, inset 0 0 25px #00d9ff;
      animation: spin 10s linear infinite;
      cursor: pointer;
    }
    .core {
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, #ffffff, #00d9ff);
      border-radius: 50%;
      box-shadow: 0 0 35px #00d9ff;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .status { margin-top: 25px; font-size: 1.1rem; letter-spacing: 2px; font-weight: bold; }
    #response-box { margin-top: 20px; width: 90%; max-height: 180px; overflow-y: auto; color: #fff; font-size: 0.95rem; line-height: 1.4; }
    .key-btn {
      position: absolute;
      bottom: 20px;
      background: transparent;
      border: 1px solid #00d9ff55;
      color: #00d9ff88;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <div class="arc-reactor" id="mic-btn" onclick="startListening()">
    <div class="core"></div>
  </div>

  <div class="status" id="status">TOCA PARA HABLAR</div>
  <div id="response-box">Sistemas en línea, señor.</div>

  <button class="key-btn" onclick="configurarApiKey()">⚙️ Configurar API Key</button>

  <script>
    function getApiKey() {
      let key = localStorage.getItem("GEMINI_KEY");
      if (!key) {
        key = prompt("Por favor ingresa tu API Key de Gemini:");
        if (key) localStorage.setItem("GEMINI_KEY", key.trim());
      }
      return key;
    }

    function configurarApiKey() {
      const nuevaKey = prompt("Ingresa tu API Key de Gemini:", localStorage.getItem("GEMINI_KEY") || "");
      if (nuevaKey) {
        localStorage.setItem("GEMINI_KEY", nuevaKey.trim());
        alert("Clave guardada con éxito.");
      }
    }

    const SYSTEM_INSTRUCTION = "Eres J.A.R.V.I.S., el asistente de inteligencia artificial de Tony Stark. Trata al usuario con respeto y formalidad llamándolo 'señor'. Responde de forma concisa, educada, elegante y directa.";

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'es-ES';

    function startListening() {
      const key = getApiKey();
      if (!key) return;
      document.getElementById('status').innerText = "ESCUCHANDO...";
      recognition.start();
    }

    recognition.onresult = async function(event) {
      const userText = event.results[0][0].transcript;
      document.getElementById('status').innerText = "PROCESANDO...";
      document.getElementById('response-box').innerText = `Usted: "${userText}"`;

      const apiKey = getApiKey();

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
            contents: [{ parts: [{ text: userText }] }]
          })
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message);
        }

        const reply = data.candidates[0].content.parts[0].text;
        
        document.getElementById('response-box').innerText = reply;
        document.getElementById('status').innerText = "EN LÍNEA";
        speak(reply);

      } catch (error) {
        document.getElementById('status').innerText = "ERROR EN EL SISTEMA";
        document.getElementById('response-box').innerText = "Detalle del error: " + error.message;
        console.error(error);
      }
    };

    function speak(text) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-ES';
      utterance.rate = 1.05;
      utterance.pitch = 0.9;
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
