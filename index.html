<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>
  <style>
    body {
      background-color: #030a16;
      color: #00d9ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .arc-reactor {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 3px dashed #00d9ff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px #00d9ff, inset 0 0 25px #00d9ff;
      animation: spin 10s linear infinite;
      cursor: pointer;
    }
    .core {
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, #ffffff, #00d9ff);
      border-radius: 50%;
      box-shadow: 0 0 35px #00d9ff;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .status { margin-top: 25px; font-size: 1.1rem; letter-spacing: 2px; }
    #response-box { margin-top: 20px; width: 85%; max-height: 160px; overflow-y: auto; color: #fff; font-size: 0.95rem; }
  </style>
</head>
<body>

  <div class="arc-reactor" id="mic-btn" onclick="startListening()">
    <div class="core"></div>
  </div>

  <div class="status" id="status">TOCA PARA HABLAR</div>
  <div id="response-box">Sistemas listos, señor.</div>

  <script>
    const GEMINI_API_KEY = "AQ.Ab8RN6KiJule4JZfbam5bgHxlWjNA6yrc2zI7KaRnGrxCuNq7Q";

    const SYSTEM_INSTRUCTION = "Eres J.A.R.V.I.S., el asistente de inteligencia artificial de Iron Man. Trata al usuario con respeto y formalidad (dile 'señor'), sé conciso, educado, elegante y resolutivo.";

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'es-ES';

    function startListening() {
      document.getElementById('status').innerText = "ESCUCHANDO...";
      recognition.start();
    }

    recognition.onresult = async function(event) {
      const userText = event.results[0][0].transcript;
      document.getElementById('status').innerText = "PROCESANDO...";
      document.getElementById('response-box').innerText = `Usted: "${userText}"`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
            contents: [{ parts: [{ text: userText }] }]
          })
        });

        const data = await response.json();
        const reply = data.candidates[0].content.parts[0].text;
        
        document.getElementById('response-box').innerText = reply;
        document.getElementById('status').innerText = "EN LÍNEA";
        speak(reply);

      } catch (error) {
        document.getElementById('status').innerText = "ERROR EN EL SISTEMA";
        console.error(error);
      }
    };

    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-ES';
      utterance.rate = 1.05;
      utterance.pitch = 0.9;
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
