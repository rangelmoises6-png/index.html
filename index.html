<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>
  <style>
    :root {
      --primary: #00d9ff;
      --glow: rgba(0, 217, 255, 0.45);
      --bg: #030a16;
      --surface: #06152d;
      --text: #ffffff;
    }

    body {
      background-color: var(--bg);
      color: var(--primary);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 16px;
      box-sizing: border-box;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      letter-spacing: 2px;
      padding: 4px 8px;
    }

    .hud-btn {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .main-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
    }

    .arc-reactor {
      width: 145px;
      height: 145px;
      border-radius: 50%;
      border: 3px dashed var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px var(--glow), inset 0 0 25px var(--glow);
      animation: spin 12s linear infinite;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.3s ease;
    }

    .listening {
      border-color: #ff3366 !important;
      box-shadow: 0 0 40px #ff3366, inset 0 0 35px #ff3366 !important;
      animation: pulse 1s infinite ease-in-out !important;
    }

    .core {
      width: 85px;
      height: 85px;
      background: radial-gradient(circle, #ffffff, var(--primary));
      border-radius: 50%;
      box-shadow: 0 0 35px var(--glow);
      transition: all 0.3s ease;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

    .status { margin-top: 25px; font-size: 1.1rem; letter-spacing: 2px; font-weight: bold; }
    
    #response-box {
      margin-top: 15px;
      width: 100%;
      max-width: 420px;
      max-height: 180px;
      overflow-y: auto;
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.45;
      padding: 10px;
      background: rgba(6, 21, 45, 0.4);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-sizing: border-box;
    }

    .controls-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .input-row {
      display: flex;
      width: 100%;
      gap: 8px;
    }

    .text-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--primary);
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .send-btn {
      background: var(--primary);
      color: var(--bg);
      border: none;
      font-weight: bold;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <span id="theme-name">MARK II // CIAN</span>
    <button class="hud-btn" onclick="toggleTheme()">🎨 Cambiar Armadura</button>
  </div>

  <div class="main-stage">
    <div class="arc-reactor" id="mic-btn" onclick="toggleListening()">
      <div class="core"></div>
    </div>

    <div class="status" id="status">TOCA PARA HABLAR</div>
    <div id="response-box">Sistemas integrados en línea, señor. ¿En qué puedo asistirle?</div>
  </div>

  <div class="controls-container">
    <div class="input-row">
      <input type="text" id="manual-input" class="text-input" placeholder="Comando de texto..." onkeydown="if(event.key==='Enter') sendManualText()">
      <button class="send-btn" onclick="sendManualText()">Enviar</button>
    </div>

    <div class="toolbar">
      <button class="hud-btn" onclick="resetMemory()">🧠 Borrar Memoria</button>
      <button class="hud-btn" onclick="configurarApiKey()">⚙️ Configurar API Key</button>
    </div>
  </div>

  <script>
    // --- TEMAS DE ARMADURAS ---
    const THEMES = [
      { name: "MARK II // CIAN", primary: "#00d9ff", glow: "rgba(0, 217, 255, 0.45)", bg: "#030a16", surface: "#06152d" },
      { name: "MARK III // GOLD & RED", primary: "#ffb703", glow: "rgba(255, 183, 3, 0.5)", bg: "#1f0303", surface: "#360606" },
      { name: "STEALTH // VERDE TÁCTICO", primary: "#00ff88", glow: "rgba(0, 255, 136, 0.45)", bg: "#02120a", surface: "#052615" },
      { name: "WAR MACHINE // TITANIO", primary: "#e0e0e0", glow: "rgba(255, 255, 255, 0.4)", bg: "#111114", surface: "#222228" }
    ];
    let currentThemeIdx = 0;

    function toggleTheme() {
      currentThemeIdx = (currentThemeIdx + 1) % THEMES.length;
      const t = THEMES[currentThemeIdx];
      document.documentElement.style.setProperty('--primary', t.primary);
      document.documentElement.style.setProperty('--glow', t.glow);
      document.documentElement.style.setProperty('--bg', t.bg);
      document.documentElement.style.setProperty('--surface', t.surface);
      document.getElementById('theme-name').innerText = t.name;
      playSound('activar');
    }

    // --- SONIDOS SCI-FI ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(tipo) {
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (tipo === 'activar') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(950, now + 0.12);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (tipo === 'listo') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(1300, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        }
      } catch (e) {
        console.warn("Audio Context:", e);
      }
    }

    // --- GESTIÓN DE API KEY ---
    function getApiKey() {
      let key = localStorage.getItem("GEMINI_KEY");
      if (!key) {
        key = prompt("Ingresa tu API Key de Gemini:");
        if (key) localStorage.setItem("GEMINI_KEY", key.trim());
      }
      return key;
    }

    function configurarApiKey() {
      const actual = localStorage.getItem("GEMINI_KEY") || "";
      const nueva = prompt("Ingresa tu API Key de Gemini:", actual);
      if (nueva) {
        localStorage.setItem("GEMINI_KEY", nueva.trim());
        alert("Clave actualizada.");
      }
    }

    // --- HISTORIAL Y CONFIGURACIÓN ---
    const SYSTEM_INSTRUCTION = "Eres J.A.R.V.I.S., el asistente de inteligencia artificial de Iron Man. Trata al usuario formalmente con 'señor'. Responde de forma muy concisa (máximo 2 a 3 oraciones), con elegancia, precisión y tono resolutivo.";
    let conversationHistory = [];

    function resetMemory() {
      conversationHistory = [];
      document.getElementById('response-box').innerText = "Memoria de conversación reiniciada, señor.";
      playSound('listo');
    }

    // --- RECONOCIMIENTO DE VOZ ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'es-ES';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isRecording = true;
        document.getElementById('mic-btn').classList.add('listening');
        document.getElementById('status').innerText = "ESCUCHANDO...";
      };

      recognition.onresult = (e) => processQuery(e.results[0][0].transcript);
      recognition.onerror = () => resetUI();
      recognition.onend = () => resetUI();
    }

    function resetUI() {
      isRecording = false;
      document.getElementById('mic-btn').classList.remove('listening');
      if (document.getElementById('status').innerText === "ESCUCHANDO...") {
        document.getElementById('status').innerText = "TOCA PARA HABLAR";
      }
    }

    function toggleListening() {
      initAudio();
      window.speechSynthesis.resume();
      if (!getApiKey()) return;
      if (!recognition) {
        alert("Reconocimiento de voz no soportado.");
        return;
      }

      if (!isRecording) {
        playSound('activar');
        recognition.start();
      } else {
        recognition.stop();
      }
    }

    function sendManualText() {
      const input = document.getElementById('manual-input');
      const text = input.value.trim();
      if (text) {
        input.value = "";
        processQuery(text);
      }
    }

    // --- LLAMADA A GEMINI CON HISTORIAL Y HERRAMIENTAS ---
    async function processQuery(userText) {
      document.getElementById('status').innerText = "PROCESANDO...";
      document.getElementById('response-box').innerText = `Usted: "${userText}"`;

      const apiKey = getApiKey();
      if (!apiKey) {
        document.getElementById('status').innerText = "SIN CLAVE";
        return;
      }

      // Añadir turno de usuario a la memoria
      conversationHistory.push({ role: "user", parts: [{ text: userText }] });

      // Mantener memoria en un límite razonable (últimos 12 mensajes)
      if (conversationHistory.length > 12) {
        conversationHistory = conversationHistory.slice(-12);
      }

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
            contents: conversationHistory,
            tools: [{ googleSearch: {} }]
          })
        });

        const data = await response.json();

        if (data.error) throw new Error(data.error.message);

        let reply = "";
        if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
          reply = data.candidates[0].content.parts.map(p => p.text || '').join('');
        }

        if (!reply) reply = "Comando procesado, señor.";

        // Guardar respuesta del modelo en memoria
        conversationHistory.push({ role: "model", parts: [{ text: reply }] });

        document.getElementById('response-box').innerText = reply;
        document.getElementById('status').innerText = "TOCA PARA HABLAR";
        
        playSound('listo');
        speak(reply);

      } catch (error) {
        document.getElementById('status').innerText = "ERROR EN EL SISTEMA";
        document.getElementById('response-box').innerText = "Error: " + error.message;
        console.error(error);
      }
    }

    function speak(text) {
      window.speechSynthesis.cancel();
      // Eliminar formato markdown simple antes de pronunciar
      const cleanText = text.replace(/[*_#`]/g, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'es-ES';
      utterance.rate = 1.05;
      utterance.pitch = 0.95;
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
