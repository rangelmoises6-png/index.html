<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>
  <style>
    body {
      background-color: #030a16;
      color: #00d9ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .arc-reactor {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 3px dashed #00d9ff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px #00d9ff, inset 0 0 25px #00d9ff;
      animation: spin 10s linear infinite;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .listening {
      border-color: #ff3366 !important;
      box-shadow: 0 0 35px #ff3366, inset 0 0 35px #ff3366 !important;
      animation: pulse 1.2s infinite ease-in-out !important;
    }
    .core {
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, #ffffff, #00d9ff);
      border-radius: 50%;
      box-shadow: 0 0 35px #00d9ff;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    
    .status { margin-top: 25px; font-size: 1.1rem; letter-spacing: 2px; font-weight: bold; }
    #response-box { margin-top: 15px; width: 100%; max-height: 170px; overflow-y: auto; color: #e6f7ff; font-size: 0.95rem; line-height: 1.4; }
    
    .input-row {
      margin-top: 20px;
      display: flex;
      width: 100%;
      max-width: 360px;
      gap: 8px;
    }
    .text-input {
      flex: 1;
      background: #06152d;
      border: 1px solid #00d9ff44;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }
    .send-btn {
      background: #00d9ff;
      color: #030a16;
      border: none;
      font-weight: bold;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }
    .key-btn {
      margin-top: 25px;
      background: transparent;
      border: 1px solid #00d9ff44;
      color: #00d9ff88;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <div class="arc-reactor" id="mic-btn" onclick="toggleListening()">
    <div class="core"></div>
  </div>

  <div class="status" id="status">TOCA PARA HABLAR</div>
  <div id="response-box">Sistemas listos, señor.</div>

  <div class="input-row">
    <input type="text" id="manual-input" class="text-input" placeholder="O escribe tu orden aquí..." onkeydown="if(event.key==='Enter') sendManualText()">
    <button class="send-btn" onclick="sendManualText()">Enviar</button>
  </div>

  <button class="key-btn" onclick="configurarApiKey()">⚙️ Configurar API Key</button>

  <script>
    function getApiKey() {
      let key = localStorage.getItem("GEMINI_KEY");
      if (!key) {
        key = prompt("Ingresa tu API Key de Gemini:");
        if (key) localStorage.setItem("GEMINI_KEY", key.trim());
      }
      return key;
    }

    function configurarApiKey() {
      const actual = localStorage.getItem("GEMINI_KEY") || "";
      const nueva = prompt("Ingresa tu API Key de Gemini:", actual);
      if (nueva) {
        localStorage.setItem("GEMINI_KEY", nueva.trim());
        alert("Clave guardada con éxito.");
      }
    }

    const SYSTEM_INSTRUCTION = "Eres J.A.R.V.I.S., el asistente de inteligencia artificial de Iron Man. Responde de forma muy concisa (máximo 2 a 3 oraciones), con elegancia, llamando al usuario 'señor'.";

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'es-ES';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = function() {
        isRecording = true;
        document.getElementById('mic-btn').classList.add('listening');
        document.getElementById('status').innerText = "ESCUCHANDO...";
      };

      recognition.onresult = function(event) {
        const text = event.results[0][0].transcript;
        processQuery(text);
      };

      recognition.onerror = function(event) {
        console.warn("Speech error:", event.error);
        resetUI();
      };

      recognition.onend = function() {
        resetUI();
      };
    }

    function resetUI() {
      isRecording = false;
      document.getElementById('mic-btn').classList.remove('listening');
      if (document.getElementById('status').innerText === "ESCUCHANDO...") {
        document.getElementById('status').innerText = "TOCA PARA HABLAR";
      }
    }

    function toggleListening() {
      window.speechSynthesis.resume();

      const apiKey = getApiKey();
      if (!apiKey) return;

      if (!recognition) {
        alert("Reconocimiento de voz no soportado. Usa la barra de texto.");
        return;
      }

      try {
        if (!isRecording) {
          recognition.start();
        } else {
          recognition.stop();
        }
      } catch (e) {
        console.error(e);
      }
    }

    function sendManualText() {
      const input = document.getElementById('manual-input');
      const text = input.value.trim();
      if (text) {
        input.value = "";
        processQuery(text);
      }
    }

    async function processQuery(userText) {
      document.getElementById('status').innerText = "PROCESANDO...";
      document.getElementById('response-box').innerText = `Usted: "${userText}"`;

      const apiKey = getApiKey();
      if (!apiKey) {
        document.getElementById('status').innerText = "SIN CLAVE";
        return;
      }

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
            contents: [{ parts: [{ text: userText }] }]
          })
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message);
        }

        const reply = data.candidates[0].content.parts[0].text;
        document.getElementById('response-box').innerText = reply;
        document.getElementById('status').innerText = "TOCA PARA HABLAR";
        speak(reply);

      } catch (error) {
        document.getElementById('status').innerText = "ERROR EN EL SISTEMA";
        document.getElementById('response-box').innerText = "Error: " + error.message;
        console.error(error);
      }
    }

    function speak(text) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-ES';
      utterance.rate = 1.05;
      utterance.pitch = 0.95;
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
